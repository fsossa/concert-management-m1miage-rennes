<section class="rounded-2xl border border-[#d6e8f0] bg-white p-10 shadow-sm">
  <p class="text-xs font-semibold uppercase tracking-[0.14em] text-[#6b7a86]">Module organize</p>
  <h3 class="mt-3 text-3xl font-black text-[#1f2f42]">{{ sectionTitle }}</h3>

  @if (error()) {
    <p class="mt-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-600">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="mt-4 text-sm text-[#5f6f7c]">Chargement des donnees...</p>
  } @else {
    <div class="mt-5 space-y-3">
      @for (row of rows(); track row) {
        <div class="rounded-xl border border-[#d5e8ef] bg-[#f8fcff] px-4 py-3 text-sm font-semibold text-[#2e495d]">
          {{ row }}
        </div>
      }

      @if (rows().length === 0) {
        <p class="text-sm text-[#5f6f7c]">Aucune donnee disponible.</p>
      }
    </div>
  }
</section>
